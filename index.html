<body>

<script>

  var seed = 12345, px = 0, py = 0;
  try { localStorage.removeItem('kingdom-save-v1'); } catch (e) {}

  // ---------- seeded generation: same coordinates always give same land
  function hash2(x, y) {
    var h = (x * 374761393 + y * 668265263 + seed * 974634) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  function chunkFeatures(cx, cy) {
    var r = hash2(cx, cy), out = [], n = Math.floor(r * 4); // 0..3 features
    for (var i = 0; i < n; i++) {
      var r2 = hash2(cx * 7 + i * 13 + 5, cy * 11 + i * 17 + 3);
      var r3 = hash2(cx * 3 + i * 29 + 11, cy * 5 + i * 7 + 1);
      var fx = cx * 384 + r2 * 384, fy = cy * 384 + r3 * 384;
      if (Math.abs(fx) < 7950 && fy > -10450 && fy < 60) continue; // keep castle + walls clear (meadow outside the south wall is wild again)
      if (Math.abs(fx) < 160 && Math.abs(fy) < 140) continue; // keep spawn clear
      if (Math.abs(fx) < 1450 && fy < 420) continue; // keep the gate approach open
      if (Math.abs(fx - city.x) < CITY_W && Math.abs(fy - city.y) < CITY_H) continue; // keep my city clear
      if (blockedWorld(fx, fy) || nearFactionCity(fx, fy)) continue; // no trees in the sea or inside faction towns
      out.push({ id: cx + ',' + cy + ',' + i, x: fx, y: fy, kind: r2 > 0.45 ? 'tree' : (r3 > 0.86 ? 'gold' : 'rock'), s: 0.8 + r3 * 0.5 });
    }
    return out;
  }
  function goldOre(c, x, y, s) {
    rock(c, x, y, s * 1.1);
    c.fillStyle = '#fff';
    [[-8, -7], [3, -11], [9, -5]].forEach(function (p) {
      var a = x + p[0] * s, b = y + p[1] * s;
      poly(c, [[a, b - 4 * s], [a + 1.5 * s, b], [a, b + 4 * s], [a - 1.5 * s, b]]);
      poly(c, [[a - 4 * s, b], [a, b - 1.5 * s], [a + 4 * s, b], [a, b + 1.5 * s]]);
    });
  }
